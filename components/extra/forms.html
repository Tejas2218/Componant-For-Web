<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms & Color Palette Guide</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc; color: #0f172a; padding: 3rem 1.5rem; line-height: 1.5;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 1.75rem; margin-top: 1.5rem; }
    
    .form-group { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .form-label { font-size: 0.875rem; font-weight: 600; }
    .form-input { padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; transition: border-color 0.2s; }
    .form-input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }

    /* Palette Swatches */
    .palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 1rem; }
    @media (max-width: 600px) { .palette-grid { grid-template-columns: repeat(2, 1fr); } }
    .swatch-box { height: 70px; border-radius: 10px; padding: 0.75rem; color: #fff; font-weight: 700; font-size: 0.85rem; display: flex; flex-direction: column; justify-content: space-between; }
  </style>
</head>
<body>

  <div class="container">
    <h1 style="font-size: 2rem; font-weight: 800;">Forms UI & Color Palette Guide</h1>
    <p style="color: #64748b; margin-top: 0.25rem;">Form elements and ready-to-use color schemes for hackathons.</p>

    <!-- Color Palettes -->
    <div class="card">
      <h3 style="font-weight: 700;">🎨 Recommended Color Combinations</h3>
      <div class="palette-grid">
        <div class="swatch-box" style="background: linear-gradient(135deg, #4f46e5, #7c3aed);">
          <span>Indigo Purple</span>
          <span style="font-size: 0.7rem; opacity: 0.8;">SaaS / Tech</span>
        </div>
        <div class="swatch-box" style="background: linear-gradient(135deg, #06b6d4, #3b82f6);">
          <span>Cyan Blue</span>
          <span style="font-size: 0.7rem; opacity: 0.8;">Fintech / Web</span>
        </div>
        <div class="swatch-box" style="background: linear-gradient(135deg, #10b981, #059669);">
          <span>Emerald Green</span>
          <span style="font-size: 0.7rem; opacity: 0.8;">Eco / Finance</span>
        </div>
        <div class="swatch-box" style="background: linear-gradient(135deg, #ec4899, #8b5cf6);">
          <span>Pink Violet</span>
          <span style="font-size: 0.7rem; opacity: 0.8;">Creative / AI</span>
        </div>
      </div>
    </div>

    <!-- Form Elements -->
    <div class="card">
      <h3 style="font-weight: 700; margin-bottom: 1rem;">📝 Input Fields & Select Controls</h3>
      <div class="form-group">
        <label class="form-label">Project Name</label>
        <input type="text" class="form-input" placeholder="e.g. Hackathon MVP">
      </div>

      <div class="form-group">
        <label class="form-label">Category Select</label>
        <select class="form-input">
          <option>Artificial Intelligence</option>
          <option>Fintech & Web3</option>
          <option>Developer Tooling</option>
        </select>
      </div>
    </div>
  </div>

</body>
</html>
