<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loaders & Spinners Variety Pack (3 Styles)</title>
  <link rel="stylesheet" href="../../css/hackathon-ui.css">
  <style>
    body { background: #f8fafc; padding: 4rem 0; }
    .loader-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
    }
    /* Wave dots loader */
    .wave-dots { display: inline-flex; gap: 6px; }
    .wave-dots div {
      width: 10px; height: 10px; border-radius: 50%; background: var(--primary);
      animation: wave 1.2s infinite ease-in-out;
    }
    .wave-dots div:nth-child(2) { animation-delay: 0.2s; }
    .wave-dots div:nth-child(3) { animation-delay: 0.4s; }
    @keyframes wave {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container" style="max-width: 800px;">
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 2rem; text-align: center;">Loaders & Spinners Variety Pack</h1>

    <div class="grid grid-cols-3 md:grid-cols-1 gap-6">
      <!-- 1. Spinner Ring -->
      <div class="loader-box">
        <h3 style="font-weight: 700; margin-bottom: 1rem; font-size: 0.95rem;">1. Gradient Ring Spinner</h3>
        <div class="spinner" style="margin: 0 auto; width: 36px; height: 36px;"></div>
      </div>

      <!-- 2. Skeleton Shimmer -->
      <div class="loader-box">
        <h3 style="font-weight: 700; margin-bottom: 1rem; font-size: 0.95rem;">2. Skeleton Pulse Placeholder</h3>
        <div class="skeleton" style="height: 14px; width: 80%; margin-bottom: 8px;"></div>
        <div class="skeleton" style="height: 14px; width: 60%;"></div>
      </div>

      <!-- 3. Wave Dots -->
      <div class="loader-box">
        <h3 style="font-weight: 700; margin-bottom: 1rem; font-size: 0.95rem;">3. Bouncing Wave Dots</h3>
        <div class="wave-dots" style="margin-top: 0.5rem;">
          <div></div><div></div><div></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
