<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards Variety Pack</title>
  <link rel="stylesheet" href="../../css/hackathon-ui.css">
  <style>
    body { background: #f8fafc; padding: 4rem 0; }
    
    /* 3D Flip Card */
    .flip-card {
      background-color: transparent;
      width: 100%; height: 220px;
      perspective: 1000px;
    }
    .flip-card-inner {
      position: relative; width: 100%; height: 100%;
      text-align: center; transition: transform 0.6s;
      transform-style: preserve-3d;
      border-radius: var(--radius-lg);
    }
    .flip-card:hover .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back {
      position: absolute; width: 100%; height: 100%;
      -webkit-backface-visibility: hidden; backface-visibility: hidden;
      border-radius: var(--radius-lg); padding: 1.5rem;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .flip-card-front { background: #ffffff; border: 1px solid #e2e8f0; color: #0f172a; }
    .flip-card-back { background: var(--primary); color: #fff; transform: rotateY(180deg); }
  </style>
</head>
<body>

  <div class="container" style="max-width: 900px;">
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 2rem; text-align: center;">Cards Variety Pack</h1>

    <div class="grid grid-cols-3 md:grid-cols-1 gap-6">
      <!-- 1. Stat KPI Card -->
      <div style="background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:1.5rem;">
        <div style="color:#64748b; font-size:0.85rem;">Active Subscribers</div>
        <div style="font-size: 2rem; font-weight: 800; margin-top: 0.25rem;">12,840</div>
        <span class="badge badge-success" style="margin-top: 0.5rem;">+14.5% vs last week</span>
      </div>

      <!-- 2. Feature Card -->
      <div style="background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:1.5rem;">
        <div style="width:40px; height:40px; background:var(--primary-light); color:var(--primary); border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; margin-bottom:1rem;">⚡</div>
        <h3 style="font-weight: 700;">Lightning Fast CDN</h3>
        <p style="color:#64748b; font-size:0.85rem; margin-top:0.25rem;">Edge assets cached in over 240+ global locations worldwide.</p>
      </div>

      <!-- 3. Interactive Flip Card -->
      <div class="flip-card">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <h3 style="font-weight: 700;">Hover to Flip 🔄</h3>
            <p style="color:#64748b; font-size:0.85rem; margin-top:0.25rem;">Front side info card</p>
          </div>
          <div class="flip-card-back">
            <h3 style="font-weight: 700;">Back Details ✨</h3>
            <p style="font-size:0.85rem; margin-top:0.25rem;">Revealed back card contents & action CTAs.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
