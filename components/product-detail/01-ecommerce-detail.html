<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern E-Commerce Detail Page</title>
  <link rel="stylesheet" href="../../css/hackathon-ui.css">
  <style>
    body { background: #ffffff; color: #0f172a; padding-bottom: 4rem; }
    .main-img {
      width: 100%;
      height: 440px;
      object-fit: cover;
      border-radius: var(--radius-xl);
      background: #f1f5f9;
    }
    .thumb-img {
      width: 80px; height: 80px; object-fit: cover; border-radius: 12px; cursor: pointer;
      border: 2px solid transparent; transition: all 0.2s;
    }
    .thumb-img.active { border-color: var(--primary); }
    .option-btn {
      padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff;
      font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
    }
    .option-btn.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
  </style>
</head>
<body>

  <div class="container" style="padding-top: 3rem;">
    <div class="grid grid-cols-2 lg:grid-cols-1 gap-12">
      <!-- Image Gallery -->
      <div>
        <img id="main-view" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800&auto=format&fit=crop&q=80" class="main-img" alt="Headphones">
        <div class="flex gap-3" style="margin-top: 1rem;">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=200&auto=format&fit=crop&q=80" class="thumb-img active" onclick="switchMainImage(this)">
          <img src="https://images.unsplash.com/photo-1484704849700-f032a568e944?w=200&auto=format&fit=crop&q=80" class="thumb-img" onclick="switchMainImage(this)">
        </div>
      </div>

      <!-- Detail Info -->
      <div>
        <span class="badge badge-primary" style="margin-bottom: 0.5rem;">In Stock • Ships Free</span>
        <h1 style="font-size: 2.25rem; font-weight: 800; line-height: 1.2;">Studio Wireless Headphones Pro</h1>
        <div class="flex items-center gap-2" style="margin: 0.75rem 0;">
          <span style="color: #f59e0b; font-weight: 700;">★★★★★</span>
          <span style="font-weight: 600; font-size: 0.9rem;">4.9 (248 Customer Reviews)</span>
        </div>

        <div style="font-size: 2.25rem; font-weight: 800; color: var(--primary); margin: 1rem 0;">
          $199.00 <span style="font-size: 1rem; color: #94a3b8; text-decoration: line-through;">$249.00</span>
        </div>

        <p style="color: #64748b; line-height: 1.6; margin-bottom: 1.5rem;">
          Experience unparalleled sound clarity with active noise cancellation, custom acoustic drivers, and 60-hour continuous playback.
        </p>

        <!-- Color Selector -->
        <div style="margin-bottom: 1.5rem;">
          <div style="font-weight: 600; font-size: 0.875rem; margin-bottom: 0.5rem;">Select Color:</div>
          <div class="flex gap-2">
            <button class="option-btn active">Midnight Black</button>
            <button class="option-btn">Silver Aluminum</button>
            <button class="option-btn">Space Gray</button>
          </div>
        </div>

        <!-- Quantity & CTA -->
        <div class="flex gap-4 items-center">
          <div class="flex items-center border" style="border-radius: var(--radius-md); overflow: hidden;">
            <button style="padding: 0.75rem 1rem; background:#f1f5f9; border:none; cursor:pointer;" onclick="adjustQty(-1)">-</button>
            <span id="qty-val" style="padding: 0.75rem 1.25rem; font-weight: 700;">1</span>
            <button style="padding: 0.75rem 1rem; background:#f1f5f9; border:none; cursor:pointer;" onclick="adjustQty(1)">+</button>
          </div>

          <button class="btn btn-primary btn-lg flex-1" onclick="Toast.show({title:'Added to Cart!', message:'Studio Pro (Qty: ' + document.getElementById('qty-val').textContent + ')', type:'success'})">
            Add to Shopping Cart
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/hackathon-ui.js"></script>
  <script>
    function switchMainImage(thumb) {
      document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
      document.getElementById('main-view').src = thumb.src;
    }
    function adjustQty(change) {
      const el = document.getElementById('qty-val');
      let val = parseInt(el.textContent) + change;
      if (val < 1) val = 1;
      el.textContent = val;
    }
  </script>
</body>
</html>
