<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Creative Admin Dashboard</title>
  <link rel="stylesheet" href="../../css/hackathon-ui.css">
  <style>
    body { background: #ffffff; color: #0f172a; }
    .creative-header { border-bottom: 1px solid #e2e8f0; padding: 1.5rem 0; }
    .project-grid-card {
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all 0.2s;
    }
    .project-grid-card:hover { border-color: #0f172a; box-shadow: var(--shadow-md); }
  </style>
</head>
<body>

  <header class="creative-header">
    <div class="container flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span style="font-weight: 800; font-size: 1.3rem;">STUDIO//OS</span>
        <span class="badge badge-neutral">v1.0</span>
      </div>
      <div class="flex items-center gap-3">
        <button class="btn btn-outline btn-sm" onclick="ThemeManager.toggle()">Toggle Theme</button>
        <button class="btn btn-primary btn-sm" style="background:#0f172a; border:none;" onclick="Toast.show({title:'New Project Drafted', type:'success'})">+ New Project</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 3rem; padding-bottom: 4rem;">
    <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem;">Active Creative Workspaces</h2>

    <div class="grid grid-cols-3 md:grid-cols-1 gap-6">
      <div class="project-grid-card">
        <div style="height: 160px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">🎨</div>
        <div style="padding: 1.25rem;">
          <span class="badge badge-primary">Branding</span>
          <h3 style="font-weight: 700; margin-top: 0.5rem;">Neptune Rebrand 2026</h3>
          <p style="color: #64748b; font-size: 0.85rem; margin-top: 0.25rem;">12 assets pending review</p>
        </div>
      </div>

      <div class="project-grid-card">
        <div style="height: 160px; background: #eef2ff; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">📱</div>
        <div style="padding: 1.25rem;">
          <span class="badge badge-success">Mobile App</span>
          <h3 style="font-weight: 700; margin-top: 0.5rem;">Fintech iOS Redesign</h3>
          <p style="color: #64748b; font-size: 0.85rem; margin-top: 0.25rem;">8 Figma screens linked</p>
        </div>
      </div>

      <div class="project-grid-card">
        <div style="height: 160px; background: #fef3c7; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">⚡</div>
        <div style="padding: 1.25rem;">
          <span class="badge badge-warning">Landing Page</span>
          <h3 style="font-weight: 700; margin-top: 0.5rem;">AI Studio Prototype</h3>
          <p style="color: #64748b; font-size: 0.85rem; margin-top: 0.25rem;">Deploying to Vercel</p>
        </div>
      </div>
    </div>
  </main>

  <script src="../../js/hackathon-ui.js"></script>
</body>
</html>
