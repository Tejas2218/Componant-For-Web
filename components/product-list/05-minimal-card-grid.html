<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Card Grid Component</title>
  <link rel="stylesheet" href="../../css/hackathon-ui.css">
  <style>
    body { background: #ffffff; color: #0f172a; padding: 3rem 0; }
    .min-card {
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all 0.25s;
    }
    .min-card:hover { border-color: #0f172a; box-shadow: var(--shadow-md); }
    .min-img-box {
      height: 240px;
      overflow: hidden;
      background: #f1f5f9;
      position: relative;
    }
    .min-img-box img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s ease;
    }
    .min-card:hover .min-img-box img { transform: scale(1.05); }
    .color-swatch {
      width: 14px; height: 14px; border-radius: 50%; display: inline-block; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 1.5rem;">Minimalist Furniture & Objects</h1>

    <div class="grid grid-cols-3 md:grid-cols-1 gap-6">
      <div class="min-card">
        <div class="min-img-box">
          <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500&auto=format&fit=crop&q=80" alt="Minimal Chair">
        </div>
        <div style="padding: 1.25rem;">
          <div class="flex justify-between items-center">
            <h3 style="font-weight: 700; font-size: 1.05rem;">Ergonomic Nordic Lounge Chair</h3>
            <span style="font-weight: 800;">$420</span>
          </div>
          <p style="color: #64748b; font-size: 0.85rem; margin-top: 0.25rem;">Oak wood frame with wool cushion upholstery.</p>

          <div class="flex items-center gap-2" style="margin-top: 1rem;">
            <span class="color-swatch" style="background:#0f172a;"></span>
            <span class="color-swatch" style="background:#d97706;"></span>
            <span class="color-swatch" style="background:#64748b;"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/hackathon-ui.js"></script>
</body>
</html>
