<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory Tool List Component</title>
  <link rel="stylesheet" href="../../css/hackathon-ui.css">
  <style>
    body { background: #f8fafc; color: #0f172a; padding: 3rem 0; }
    .tool-item-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }
    .tool-item-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
    .upvote-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-md);
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .upvote-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
  </style>
</head>
<body>

  <div class="container" style="max-width: 850px;">
    <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 1.5rem;">Product Hunt Style Directory</h1>

    <!-- Tool 1 -->
    <div class="tool-item-card">
      <div class="flex items-center gap-4">
        <div style="width: 52px; height: 52px; border-radius: 12px; background: #6366f1; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">A</div>
        <div>
          <div class="flex items-center gap-2">
            <h3 style="font-weight: 700; font-size: 1.1rem;">AutoCode AI</h3>
            <span class="badge badge-primary">Developer Tools</span>
          </div>
          <p style="color: #64748b; font-size: 0.875rem; margin-top: 0.25rem;">Generate production-grade React & Vue components from Figma designs.</p>
        </div>
      </div>
      <button class="upvote-btn" onclick="this.querySelector('.count').textContent = parseInt(this.querySelector('.count').textContent) + 1; Toast.show({title:'Upvoted AutoCode AI!', type:'success'})">
        ▲ <span class="count">482</span>
      </button>
    </div>

    <!-- Tool 2 -->
    <div class="tool-item-card">
      <div class="flex items-center gap-4">
        <div style="width: 52px; height: 52px; border-radius: 12px; background: #10b981; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">M</div>
        <div>
          <div class="flex items-center gap-2">
            <h3 style="font-weight: 700; font-size: 1.1rem;">MindMap Flow</h3>
            <span class="badge badge-success">Productivity</span>
          </div>
          <p style="color: #64748b; font-size: 0.875rem; margin-top: 0.25rem;">Infinite canvas brainstorming tool for remote engineering teams.</p>
        </div>
      </div>
      <button class="upvote-btn" onclick="this.querySelector('.count').textContent = parseInt(this.querySelector('.count').textContent) + 1; Toast.show({title:'Upvoted MindMap Flow!', type:'success'})">
        ▲ <span class="count">319</span>
      </button>
    </div>
  </div>

  <script src="../../js/hackathon-ui.js"></script>
</body>
</html>
