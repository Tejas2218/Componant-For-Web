<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 - Dark SaaS Login & Signup</title>
  <style>
    /* ==========================================================================
       COMPONENT: 01 - Dark SaaS Auth (Self-Contained CSS)
       Copy everything inside <style> for component styles
       ========================================================================== */
    
    /* Base Reset & Variables */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      line-height: 1.5;
    }

    /* Auth Card Container */
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #131b2e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Header & Typography */
    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.75rem;
    }
    .auth-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
    }
    .auth-title { font-size: 1.5rem; font-weight: 700; color: #f8fafc; margin-bottom: 0.375rem; }
    .auth-subtitle { font-size: 0.875rem; color: #94a3b8; }

    /* Social OAuth Buttons */
    .social-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .social-btn:hover { background: #334155; border-color: #475569; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: #64748b;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #1e293b; }
    .divider span { padding: 0 0.75rem; }

    /* Form Fields & Validation States */
    .form-group { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 0.375rem; }
    .form-label { font-size: 0.875rem; font-weight: 500; color: #f8fafc; }
    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background-color: #0f172a;
      color: #f8fafc;
      outline: none;
      transition: all 0.2s;
    }
    .form-input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3); }
    .form-input::placeholder { color: #64748b; }

    /* Validation UI */
    .form-group.is-valid .form-input { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
    .form-group.is-invalid .form-input { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2); }
    .validation-msg { font-size: 0.775rem; margin-top: 0.25rem; }
    .form-group.is-valid .validation-msg { color: #10b981; }
    .form-group.is-invalid .validation-msg { color: #ef4444; }

    .input-wrapper { position: relative; }
    .pwd-toggle-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: #64748b; cursor: pointer; display: flex; align-items: center;
    }
    .pwd-toggle-btn:hover { color: #94a3b8; }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover { background: #4338ca; box-shadow: 0 0 20px rgba(79, 70, 229, 0.4); }

    /* Checkbox */
    .checkbox-custom { display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none; font-size: 0.875rem; color: #94a3b8; }
    .checkbox-custom input { display: none; }
    .checkmark { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid #334155; background: #0f172a; display: flex; align-items: center; justify-content: center; }
    .checkbox-custom input:checked ~ .checkmark { background: #4f46e5; border-color: #4f46e5; }
    .checkmark::after { content: ''; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); display: none; }
    .checkbox-custom input:checked ~ .checkmark::after { display: block; }

    /* Toast Notification */
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: #fff;
      padding: 1rem 1.25rem; border-radius: 10px; border-left: 4px solid #10b981;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 0.75rem;
      transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <!-- HTML COMPONENT STRUCTURE -->
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <div class="auth-logo-icon">S</div>
        <span>SaaSify</span>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Enter your credentials to access your workspace</p>
    </div>

    <!-- Social OAuth Buttons -->
    <div class="social-btns">
      <button class="social-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 12s.7 4.3 1.9 6.7l3.7-3.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16.7C3.7 20.4 7.5 23 12 23z"/></svg>
        Google
      </button>
      <button class="social-btn">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </button>
    </div>

    <div class="divider">
      <span>Or continue with email</span>
    </div>

    <!-- Login Form -->
    <form id="dark-login-form" onsubmit="handleLogin(event)">
      <div class="form-group" id="email-group">
        <label class="form-label" for="email">Work Email</label>
        <input type="email" id="email" class="form-input" placeholder="name@company.com" required onblur="validateEmailField(this)">
        <span class="validation-msg"></span>
      </div>

      <div class="form-group" id="pwd-group">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label class="form-label" for="password">Password</label>
          <a href="#" style="font-size: 0.775rem; color:#6366f1; text-decoration:none;">Forgot?</a>
        </div>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
          <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility('password', this)">
            👁️
          </button>
        </div>
        <span class="validation-msg"></span>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
        <label class="checkbox-custom">
          <input type="checkbox" checked>
          <span class="checkmark"></span>
          <span>Remember me for 30 days</span>
        </label>
      </div>

      <button type="submit" class="btn-submit">Sign In to Dashboard</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: #94a3b8;">
      Don't have an account? <a href="#" style="color: #6366f1; font-weight: 600; text-decoration:none;">Start 14-day trial</a>
    </div>
  </div>

  <div id="toast-msg" class="toast">
    <span style="font-size:1.2rem;">✅</span>
    <div>
      <div style="font-weight:700; font-size:0.9rem;">Success</div>
      <div id="toast-text" style="font-size:0.8rem; color:#94a3b8;">Logging into dashboard...</div>
    </div>
  </div>

  <!-- COMPONENT JAVASCRIPT LOGIC -->
  <script>
    function validateEmailField(input) {
      const group = input.closest('.form-group');
      const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value);
      if (isValid) {
        group.classList.remove('is-invalid');
        group.classList.add('is-valid');
        group.querySelector('.validation-msg').textContent = 'Email address is valid';
      } else if (input.value) {
        group.classList.remove('is-valid');
        group.classList.add('is-invalid');
        group.querySelector('.validation-msg').textContent = 'Please enter a valid work email';
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🔒';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const toast = document.getElementById('toast-msg');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }
  </script>
</body>
</html>
