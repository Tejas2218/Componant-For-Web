<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Soft UI Auth</title>
  <link rel="stylesheet" href="../../css/hackathon-ui.css">
  <style>
    body {
      background: #e0e5ec;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .neu-card {
      width: 100%;
      max-width: 420px;
      background: #e0e5ec;
      box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.6);
      border-radius: 24px;
      padding: 2.5rem 2rem;
    }
    .neu-tab-group {
      display: flex;
      background: #e0e5ec;
      box-shadow: inset 4px 4px 8px rgb(163,177,198,0.7), inset -4px -4px 8px rgba(255,255,255, 0.8);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 2rem;
    }
    .neu-tab {
      flex: 1;
      text-align: center;
      padding: 0.625rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .neu-tab.active {
      background: #e0e5ec;
      box-shadow: 4px 4px 8px rgb(163,177,198,0.6), -4px -4px 8px rgba(255,255,255, 0.6);
      color: #4f46e5;
    }
    .neu-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      border: none;
      background: #e0e5ec;
      box-shadow: inset 4px 4px 8px rgb(163,177,198,0.7), inset -4px -4px 8px rgba(255,255,255, 0.8);
      outline: none;
      color: #1e293b;
    }
    .neu-btn {
      width: 100%;
      padding: 0.875rem;
      border-radius: 12px;
      border: none;
      background: #e0e5ec;
      box-shadow: 6px 6px 12px rgb(163,177,198,0.7), -6px -6px 12px rgba(255,255,255, 0.8);
      font-weight: 700;
      color: #4f46e5;
      cursor: pointer;
      transition: all 0.2s;
    }
    .neu-btn:active {
      box-shadow: inset 4px 4px 8px rgb(163,177,198,0.7), inset -4px -4px 8px rgba(255,255,255, 0.8);
    }
  </style>
</head>
<body>

  <div class="neu-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="color: #334155; font-size: 1.5rem; font-weight: 700;">Soft UI Auth</h2>
    </div>

    <div class="neu-tab-group" data-tab-group="neu-auth">
      <div class="neu-tab active" data-tab="login-tab">Login</div>
      <div class="neu-tab" data-tab="signup-tab">Sign Up</div>
    </div>

    <!-- Login Form -->
    <div id="login-tab" data-tab-content="neu-auth">
      <form onsubmit="event.preventDefault(); Toast.show({title:'Logged In (Neumorphic)', type:'success'});">
        <div class="form-group">
          <label class="form-label" style="color:#475569;">Username or Email</label>
          <input type="text" class="neu-input" placeholder="user@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" style="color:#475569;">Password</label>
          <input type="password" class="neu-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="neu-btn" style="margin-top: 1rem;">Sign In</button>
      </form>
    </div>

    <!-- Signup Form -->
    <div id="signup-tab" data-tab-content="neu-auth" style="display: none;">
      <form onsubmit="event.preventDefault(); Toast.show({title:'Account Registered', type:'success'});">
        <div class="form-group">
          <label class="form-label" style="color:#475569;">Full Name</label>
          <input type="text" class="neu-input" placeholder="Jane Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label" style="color:#475569;">Email</label>
          <input type="email" class="neu-input" placeholder="jane@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" style="color:#475569;">Create Password</label>
          <input type="password" class="neu-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="neu-btn" style="margin-top: 1rem;">Create Account</button>
      </form>
    </div>
  </div>

  <script src="../../js/hackathon-ui.js"></script>
</body>
</html>
