<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern SaaS User Profile Page</title>
  <link rel="stylesheet" href="../../css/hackathon-ui.css">
  <style>
    body { background: #f8fafc; color: #0f172a; padding-bottom: 4rem; }
    .cover-banner {
      height: 200px;
      background: linear-gradient(135deg, #4f46e5 0%, #a855f7 100%);
      position: relative;
    }
    .profile-header-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 1.5rem;
      position: relative;
    }
    .avatar-wrapper {
      position: absolute;
      top: -60px;
      left: 1.5rem;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background: #3b82f6;
      color: #fff;
      font-size: 2.5rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
    }
    .profile-nav {
      display: flex;
      gap: 1.5rem;
      border-bottom: 1px solid #e2e8f0;
      margin-top: 2rem;
    }
    .profile-nav-item {
      padding: 0.75rem 0.5rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .profile-nav-item.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .profile-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <!-- Cover Header -->
  <div class="cover-banner"></div>

  <div class="profile-header-container">
    <div class="avatar-wrapper">AR</div>
    
    <div class="flex justify-between items-center" style="padding-top: 70px;">
      <div>
        <h1 style="font-size: 1.75rem; font-weight: 800;">Alex Rivera</h1>
        <p style="color: #64748b; font-size: 0.95rem;">Senior Frontend Architect @ TechCorp • San Francisco, CA</p>
      </div>
      <button class="btn btn-outline" onclick="Toast.show({title:'Profile Edit Saved', type:'success'})">Edit Profile</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="profile-nav" data-tab-group="profile-tabs">
      <div class="profile-nav-item active" data-tab="tab-overview">Overview & Info</div>
      <div class="profile-nav-item" data-tab="tab-security">Security & Password</div>
      <div class="profile-nav-item" data-tab="tab-billing">Billing & Plan</div>
    </div>

    <!-- Overview Tab Content -->
    <div id="tab-overview" data-tab-content="profile-tabs">
      <div class="grid grid-cols-3 md:grid-cols-1 gap-6">
        <!-- Personal Info Form -->
        <div class="profile-card" style="grid-column: span 2;">
          <h3 style="font-weight: 700; margin-bottom: 1.25rem;">Personal Details</h3>
          <form onsubmit="event.preventDefault(); Toast.show({title:'Settings Saved!', type:'success'});">
            <div class="grid grid-cols-2 gap-4">
              <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" class="form-input" value="Alex">
              </div>
              <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-input" value="Rivera">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-input" value="alex.rivera@techcorp.io">
            </div>

            <div class="form-group">
              <label class="form-label">Bio / Summary</label>
              <textarea class="form-input" rows="3">Building open source UI frameworks and scaling high-performance web applications.</textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">Save Changes</button>
          </form>
        </div>

        <!-- Sidebar Stats -->
        <div class="profile-card">
          <h3 style="font-weight: 700; margin-bottom: 1rem;">Account Stats</h3>
          <div style="margin-bottom: 1rem;">
            <div style="color: #64748b; font-size: 0.8rem;">Member Since</div>
            <div style="font-weight: 600;">March 2024 (2 Years)</div>
          </div>
          <div style="margin-bottom: 1rem;">
            <div style="color: #64748b; font-size: 0.8rem;">Current Subscription</div>
            <span class="badge badge-primary">Pro Enterprise Plan</span>
          </div>
          <div>
            <div style="color: #64748b; font-size: 0.8rem;">API Requests (This Month)</div>
            <div style="font-weight: 700; font-size: 1.25rem;">142,900</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/hackathon-ui.js"></script>
</body>
</html>
