<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Tech Profile</title>
  <link rel="stylesheet" href="../../css/hackathon-ui.css">
  <style>
    body { background: #0d1117; color: #c9d1d9; padding: 2rem 0; }
    .dev-profile-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: var(--radius-xl);
      padding: 2rem;
    }
    .skill-pill {
      background: #21262d;
      border: 1px solid #30363d;
      color: #58a6ff;
      padding: 0.3rem 0.75rem;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container" style="max-width: 900px;">
    <div class="dev-profile-card">
      <div class="flex items-center gap-6 md:flex-col" style="margin-bottom: 2rem;">
        <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #238636, #1f6feb); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; color: #fff;">
          &lt;/&gt;
        </div>
        <div>
          <div class="flex items-center gap-3">
            <h1 style="font-size: 1.8rem; font-weight: 800; color: #f0f6fc;">DevOps_Ninja</h1>
            <span class="badge badge-success">Open to Work</span>
          </div>
          <p style="color: #8b949e; margin-top: 0.25rem;">Full Stack Developer & Rust Enthusiast • github.com/devops-ninja</p>
          
          <div class="flex gap-2" style="margin-top: 1rem; flex-wrap: wrap;">
            <span class="skill-pill">TypeScript</span>
            <span class="skill-pill">Rust</span>
            <span class="skill-pill">WebAssembly</span>
            <span class="skill-pill">Docker</span>
            <span class="skill-pill">GraphQL</span>
          </div>
        </div>
      </div>

      <!-- Activity Heatmap Mockup -->
      <div style="border-top: 1px solid #30363d; padding-top: 1.5rem;">
        <h3 style="font-size: 1rem; font-weight: 600; color: #f0f6fc; margin-bottom: 1rem;">1,842 contributions in the last year</h3>
        <div style="display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px;">
          <!-- Generating fake green contribution blocks -->
          <div style="height:12px; background:#0e4429; border-radius:2px;"></div>
          <div style="height:12px; background:#006d32; border-radius:2px;"></div>
          <div style="height:12px; background:#26a641; border-radius:2px;"></div>
          <div style="height:12px; background:#39d353; border-radius:2px;"></div>
          <div style="height:12px; background:#006d32; border-radius:2px;"></div>
          <div style="height:12px; background:#26a641; border-radius:2px;"></div>
          <div style="height:12px; background:#39d353; border-radius:2px;"></div>
          <div style="height:12px; background:#0e4429; border-radius:2px;"></div>
          <div style="height:12px; background:#39d353; border-radius:2px;"></div>
          <div style="height:12px; background:#26a641; border-radius:2px;"></div>
          <div style="height:12px; background:#006d32; border-radius:2px;"></div>
          <div style="height:12px; background:#39d353; border-radius:2px;"></div>
          <div style="height:12px; background:#26a641; border-radius:2px;"></div>
          <div style="height:12px; background:#006d32; border-radius:2px;"></div>
          <div style="height:12px; background:#39d353; border-radius:2px;"></div>
          <div style="height:12px; background:#26a641; border-radius:2px;"></div>
          <div style="height:12px; background:#0e4429; border-radius:2px;"></div>
          <div style="height:12px; background:#006d32; border-radius:2px;"></div>
          <div style="height:12px; background:#39d353; border-radius:2px;"></div>
          <div style="height:12px; background:#26a641; border-radius:2px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/hackathon-ui.js"></script>
</body>
</html>
